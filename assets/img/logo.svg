<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#7b52c9"/>
      <stop offset="55%" stop-color="#3a2668"/>
      <stop offset="100%" stop-color="#1c1235"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="45%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ffab00"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="35%" stop-color="#ffc93c"/>
      <stop offset="68%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#120a22" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="232" r="186" fill="url(#glow)"/>
  <!-- 小星星點綴 -->
  <g fill="#fff" opacity=".9">
    <circle cx="92" cy="104" r="6"/><circle cx="428" cy="128" r="5"/><circle cx="404" cy="330" r="4"/>
    <circle cx="112" cy="356" r="5"/><circle cx="330" cy="80" r="4"/><circle cx="176" cy="70" r="3"/>
    <circle cx="452" cy="238" r="3"/><circle cx="60" cy="240" r="3.5"/>
  </g>
  <!-- 魔法棒劃出嘅彩虹 -->
  <path d="M112 336 C 152 250, 232 214, 320 226" fill="none" stroke="url(#rainbow)" stroke-width="26" stroke-linecap="round" opacity=".95"/>
  <path d="M112 336 C 152 250, 232 214, 320 226" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".35"/>
  <!-- 主角：笑哈哈嘅魔法星星 -->
  <g filter="url(#soft)">
    <path d="M256 118 L292.4 208.6 L389.4 216.3 L314.6 279.4 L337.6 373.4 L256 322.6 L174.4 373.4 L197.4 279.4 L122.6 216.3 L219.6 208.6 Z"
          fill="url(#star)" stroke="#e08a00" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <!-- 樣 -->
  <g>
    <ellipse cx="222" cy="244" rx="19" ry="24" fill="#3a2f4a"/>
    <ellipse cx="290" cy="244" rx="19" ry="24" fill="#3a2f4a"/>
    <circle cx="228" cy="235" r="7" fill="#fff"/>
    <circle cx="296" cy="235" r="7" fill="#fff"/>
    <circle cx="192" cy="272" r="15" fill="#ff8fb1" opacity=".7"/>
    <circle cx="320" cy="272" r="15" fill="#ff8fb1" opacity=".7"/>
    <path d="M228 282 q28 26 56 0" fill="none" stroke="#3a2f4a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- 魔法小葉 -->
  <path d="M256 110 q22 -34 52 -26 q-10 34 -46 36 Z" fill="#4ecb71"/>
  <path d="M282 78 q6 -18 20 -22 q2 16 -14 24 Z" fill="#3ddc97"/>
</svg>
